<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#42ad5b">
<title>時間割 | TaskDay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:#171b18;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:18px 14px 96px}.header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px}.header h1{font-size:28px;margin:0}.note{color:#777;font-size:12px;line-height:1.6}.panel{background:#fff;border:1px solid #e1e5e2;border-radius:18px;padding:18px}.table-wrap{background:#fff;border:1px solid #dfe4e1;border-radius:18px;overflow:hidden}.timetable{display:grid;grid-template-columns:46px repeat(5,minmax(0,1fr));width:100%}.cell{min-width:0;border-right:1px solid #dfe4e1;border-bottom:1px solid #dfe4e1}.cell:nth-child(6n){border-right:0}.head{height:44px;background:#f3f6f4;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#606761}.period{min-height:76px;background:#f3f6f4;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#606761}.slot{width:100%;min-height:76px;padding:7px 4px;border:0;background:#fff;color:#171b18;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;word-break:break-all;overflow:hidden}.slot.done{background:#eaf6ed}.slot span{max-width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.empty-title{font-size:18px;color:#c6cbc7}.legend{margin:12px 2px 0;color:#777;font-size:11px;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:200}.modal.show{display:flex}.sheet{width:min(650px,100%);max-height:88dvh;overflow:auto;background:#fff;border-radius:24px 24px 18px 18px;padding:22px 18px}.sheet h2{margin:0 0 16px;font-size:22px}.label{display:block;color:#777;font-size:12px;margin:13px 0 6px}.input{width:100%;padding:12px;border:1px solid #dfe4e0;border-radius:10px;background:#fff;box-sizing:border-box}.memo{min-height:120px;resize:vertical;line-height:1.5}.status-title{margin:18px 0 8px;color:#777;font-size:12px}.status-buttons{display:flex;gap:10px}.status-buttons button{flex:1;height:52px;border:1px solid #dfe4e0;border-radius:12px;background:#fff;font-size:25px;font-weight:800}.status-buttons .selected{background:#eaf6ed;border-color:#b9dfc1;color:#2d9147}.status-buttons .status-x.selected{background:#fff;color:#555;border-color:#d6d9d7}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;padding:13px;border-radius:11px;font-weight:800}.primary{border:0;background:#42ad5b;color:#fff}.secondary{border:1px solid #dfe4e0;background:#fff}.danger{border:0;background:#e24b4b;color:#fff}.auth{max-width:390px;margin:50px auto}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,.97);border-top:1px solid #e1e5e2;display:flex;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.04)}.bottom-nav a{flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#777;font-size:12px;font-weight:700}.bottom-nav a.active{background:#edf7ef;color:#2d9147}
@media(min-width:801px){.app{max-width:680px}.slot,.period{min-height:68px}.header h1{font-size:25px}.timetable{grid-template-columns:42px repeat(5,minmax(0,1fr))}}
@media(max-width:430px){.app{padding-left:8px;padding-right:8px}.timetable{grid-template-columns:34px repeat(5,minmax(0,1fr))}.head{height:40px;font-size:12px}.slot,.period{min-height:70px}.slot{font-size:11px;padding:5px 3px}.period{font-size:11px}.sheet{padding:20px 16px}}
@media(min-width:521px){.modal{align-items:center}.sheet{border-radius:24px}}
</style>
</head>
<body>
<main id="app" class="app">
 <div class="header"><h1>時間割</h1></div>
 <div class="table-wrap"><div class="timetable" id="grid">
  <div class="cell head">時限</div><div class="cell head">月</div><div class="cell head">火</div><div class="cell head">水</div><div class="cell head">木</div><div class="cell head">金</div>
  <div class="cell period">1</div><div class="cell period">2</div><div class="cell period">3</div><div class="cell period">4</div><div class="cell period">5</div><div class="cell period">6</div>
 </div></div>
 <div class="legend">タップ：メモ・✓/×　　長押し：授業名を追加・編集・削除</div>
</main>
<nav class="bottom-nav"><a href="./index.html">勉強時間</a><a class="active" href="./timetable.html">時間割</a><a href="./home.html">ホーム</a></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./timetable.js?v=1"></script>
</body>
</html>
