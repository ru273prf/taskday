<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.json">
<title>TaskDay - カレンダー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17181b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
button,input{font:inherit}button{border:0;background:none;color:inherit}.app{max-width:760px;margin:auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 14px}h1{margin:0;font-size:30px}.date{color:#777;font-size:14px;margin-top:4px}
.add{width:46px;height:46px;border-radius:14px;background:#111827;color:white;font-size:27px}
.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 9px}.section-title{font-size:18px;font-weight:700}.link{color:#356ae6;font-weight:600}.small{font-size:13px;color:#777}
.card{background:white;border:1px solid #e7e7eb;border-radius:18px;margin-bottom:9px;overflow:hidden}.row{display:flex;align-items:center;gap:12px;padding:15px}
.check{width:25px;height:25px;border:1.5px solid #bbb;border-radius:50%;flex:none}.check.done{background:#111827;color:#fff;border-color:#111827;display:grid;place-items:center}
.task{flex:1;text-align:left}.title{font-size:16px}.meta{font-size:12px;color:#777;margin-top:4px}.days{font-weight:800;white-space:nowrap}.danger{color:#c0392b}.today{color:#087f5b}.empty{padding:16px;color:#777}
.count{width:100%;padding:16px;display:flex;text-align:left;align-items:center;gap:12px}.count .days{margin-left:auto;font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid #e7e7eb;padding:9px 10px;display:flex;justify-content:center;gap:8px;z-index:50}nav a{padding:8px 15px;border-radius:12px;color:#777;text-decoration:none}nav a.active{background:#eef0f3;color:#17181b;font-weight:700}
.modal{z-index:10000!important}.sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom));margin-bottom:0;max-height:calc(100vh - 30px)}nav button.active{background:#eef0f3;color:#17181b;font-weight:700}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto auto 0;border-radius:24px 24px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 16px}
.field{margin:12px 0}.field label{display:block;font-size:13px;color:#777;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #e7e7eb;border-radius:13px;background:#fafafa}
.actions{display:flex;gap:10px;margin-top:18px}.primary,.secondary{flex:1;padding:13px;border-radius:13px;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#eef0f3}
.calendar{padding:14px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calhead button{font-size:23px;padding:5px 12px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week div{text-align:center;color:#777;font-size:12px;padding:4px}
.day{height:43px;border-radius:10px;display:grid;place-items:center;position:relative;touch-action:manipulation}.day.other{color:#bbb}.day.sel{background:#111827;color:#fff}.dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
</style>
</head>
<body>
<div id="app" class="app"></div>
<nav id="bottomNav"><a href="./index.html">ホーム</a><a class="active" href="./calendar.html">カレンダー</a></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>window.START_VIEW="cal";</script><script src="./app.js?v=26"></script>
</body>
</html>

<style>
/* v14: modal centered above the bottom navigation */
.modal{
  position:fixed!important;
  inset:0!important;
  z-index:10000!important;
  display:none;
  align-items:center!important;
  justify-content:center!important;
  padding:24px!important;
  box-sizing:border-box!important;
}
.modal.show{
  display:flex!important;
}
.modal .sheet{
  position:relative!important;
  width:min(680px, 100%)!important;
  max-height:calc(100vh - 48px)!important;
  margin:0!important;
  overflow-y:auto!important;
  border-radius:28px!important;
  padding:28px!important;
  box-sizing:border-box!important;
}
@media(max-width:700px){
  .modal{padding:16px!important}
  .modal .sheet{
    max-height:calc(100vh - 32px)!important;
    border-radius:24px!important;
    padding:22px!important;
  }
}
</style>

<style>
.day{position:relative!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:flex-start!important;overflow:hidden!important;padding:8px 6px!important;text-align:left!important}
.day-number{display:block!important;font-size:16px!important;font-weight:600!important;margin-bottom:3px!important}
.cal-labels{display:flex!important;flex-direction:column!important;gap:2px!important;width:100%!important;overflow:hidden!important}
.cal-label{display:block!important;max-width:100%!important;overflow:hidden!important;white-space:nowrap!important;text-overflow:ellipsis!important;border-radius:4px!important;padding:2px 4px!important;font-size:11px!important;line-height:1.25!important;font-weight:700!important}
.cal-label.short{background:#eef2ff!important}
.cal-label.long{background:#f3f4f6!important}
.cal-label.weekly{background:#f5f5f5!important}
.cal-label.countdown{background:#e8f5ee!important}
</style>

<style>
/* v17 calendar */
.calendar .grid{grid-template-rows:repeat(6, minmax(105px,1fr))!important;gap:2px!important}
.calendar .day{height:105px!important;min-height:105px!important;box-sizing:border-box!important;border:1px solid #ececec!important;border-radius:6px!important;background:#fff!important}
.calendar .day-number{font-size:18px!important;font-weight:600!important;align-self:flex-start!important}
.calendar .day.sunday .day-number,.calendar .day.holiday .day-number{color:#e53935!important}
.calendar .day.saturday .day-number{color:#3567a8!important}
.calendar .day.other .day-number{color:#b8b8b8!important}
.calendar .day.sel{background:#fff!important;border:2px solid #d1d5db!important}
.calendar .day.sel .day-number{color:inherit!important}
.calendar .day.today.sel{border:2px solid #111827!important}
.calendar .day.today.sel .day-number{color:#111827!important}
.calendar .cal-labels{min-height:0!important}
.calendar .cal-label{font-size:12px!important;line-height:1.25!important;padding:3px 5px!important;border-radius:3px!important}
.calendar .week div:first-child{color:#e53935!important}
.calendar .week div:last-child{color:#3567a8!important}
</style>

<style>
/* v18: calendar-only events, date add choice, long press editing */
.calendar .day.today{border:2px solid #111827!important}
.calendar .day.today.sel{background:#fff!important}
.calendar .day.today.sel .day-number{color:#111827!important}
.calendar .cal-label.task{background:#dff3df!important;color:#111827!important}
.calendar .cal-label.event{background:#dbeafe!important;color:#111827!important}
.calendar .cal-label.countdown{background:#e8f5ee!important;color:#111827!important}
.calendar .cal-label.long{background:#dff3df!important;color:#111827!important}
.day-action-list{display:flex;flex-direction:column;gap:8px}
.day-action{width:100%;text-align:left;background:#f5f6f8;border-radius:13px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.day-action small{color:#777;font-size:12px}
</style>

<style>
.calendar .day.sel,
.calendar .day.sel:hover,
.calendar .day.sel:focus {
  background:#fff!important;
  color:inherit!important;
  border:1px solid #ececec!important;
}
.calendar .day.sel .day-number { color:inherit!important; }
.calendar .day.today,
.calendar .day.today.sel {
  background:#fff!important;
  border:2px solid #111827!important;
}
.calendar .day.today .day-number,
.calendar .day.today.sel .day-number { color:inherit!important; }
</style>

<style>
.card.completing{
  background:#e5e7eb!important;
  border-color:#d1d5db!important;
  opacity:.72;
  transition:background .15s ease,opacity .15s ease;
}
.card.completing .check.done{
  background:#4b5563!important;
  border-color:#4b5563!important;
  color:#fff!important;
}
</style>

<style>
.restore-check{
  min-width:42px!important;
  min-height:42px!important;
  border-radius:50%!important;
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  font-size:22px!important;
  font-weight:700!important;
}
</style>
