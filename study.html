<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#42ad5b">
<title>勉強時間 | TaskDay</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f8f7;color:#1d211e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:18px 14px 92px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 12px}
.project-btn{border:0;background:none;font-size:22px;font-weight:800;padding:7px 0}
.settings{border:1px solid #dfe4e0;background:#fff;border-radius:11px;padding:8px 11px}
.card{background:#fff;border:1px solid #e1e5e2;border-radius:18px;margin-bottom:12px;padding:16px}
.meta{text-align:center;color:#7b827d;font-size:12px}
.summary{display:flex;justify-content:center;gap:34px;margin:12px 0 4px;text-align:center}
.summary b{display:block;color:#2d9147;font-size:19px}
.summary span{display:block;color:#7b827d;font-size:11px;margin-top:2px}
.switch-row{display:flex;justify-content:flex-end;gap:7px;margin-bottom:3px}
.switch-row button{border:1px solid #ccd6ce;background:#fff;border-radius:9px;padding:5px 9px;font-size:12px}
.legend{display:flex;justify-content:center;gap:18px;color:#7b827d;font-size:11px;margin-top:2px}
.legend i{display:inline-block;width:27px;border-top:2px dashed #555;vertical-align:middle;margin-right:5px}
.legend i.actual{border-top-style:solid;border-color:#42ad5b}
.chart{width:100%;display:block}
.chart-note{text-align:center;color:#7b827d;font-size:11px;margin-top:3px}
.section-title{font-size:16px;font-weight:800;margin:0 0 10px}
.calendar-card{padding:14px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead button{border:0;background:none;font-size:23px;padding:4px 10px}
.month-title{font-weight:800;font-size:16px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week div{text-align:center;color:#777;font-size:11px;font-weight:700;padding:4px}
.day{min-height:48px;border:1px solid transparent;border-radius:10px;background:#fff;font-size:12px;padding:4px 2px;position:relative}
.day.other{color:#bbb}
.day.in-range{border-color:#edf0ed}
.day.has{border-color:#b9dfc1;color:#2d9147;font-weight:800}
.day.selected{background:#42ad5b;color:#fff;border-color:#42ad5b}
.day small{display:block;font-size:9px;margin-top:2px}
.plus{position:fixed;right:max(22px,calc((100vw - 760px)/2 + 22px));bottom:88px;width:52px;height:52px;border:0;border-radius:50%;background:#42ad5b;color:#fff;font-size:28px;box-shadow:0 5px 16px #0002}
nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,.97);border-top:1px solid #e1e5e2;display:flex;justify-content:center;gap:6px;z-index:100}
nav a{padding:10px 16px;border-radius:12px;color:#777;text-decoration:none;font-size:12px;display:flex;align-items:center}
nav a.active{background:#edf7ef;color:#2d9147;font-weight:800}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal.show{display:flex}
.sheet{width:min(650px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:24px;padding:22px}
.sheet h2{margin:0 0 16px}
.label{display:block;color:#7b827d;font-size:12px;margin:13px 0 6px}
.input{width:100%;padding:12px;border:1px solid #dfe4e0;border-radius:10px;background:#fff}
.primary,.secondary{width:100%;padding:13px;border-radius:11px;font-weight:800;margin-top:10px}
.primary{border:0;background:#42ad5b;color:#fff}.secondary{border:1px solid #dfe4e0;background:#fff}
.project-item{display:flex;align-items:center;border:1px solid #e1e5e2;border-radius:12px;padding:12px;margin:8px 0}
.project-main{flex:1;border:0;background:none;text-align:left}.project-main b{display:block}.project-main small{color:#7b827d}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #edf0ed}
.danger{background:#e24b4b!important;color:#fff!important;border:0!important}
.note{text-align:center;color:#7b827d;font-size:11px;line-height:1.6}
.empty{text-align:center;color:#7b827d;padding:28px}
.wheels{display:flex;justify-content:center;gap:12px;margin:16px 0}
.wheel{width:120px;height:172px;border:1px solid #dfe4e0;border-radius:14px;overflow:hidden;position:relative;background:#fafbfa;touch-action:none;user-select:none}
.wheel-list{transform:translateY(65px)}
.wheel:after{content:"";position:absolute;left:0;right:0;top:65px;height:40px;border-top:1px solid #bdd4c2;border-bottom:1px solid #bdd4c2;background:#42ad5b10;pointer-events:none}
.wheel-item{height:40px;display:flex;align-items:center;justify-content:center;color:#8a908c}
.wheel-item.selected{font-weight:900;color:#111!important}
.warning{background:#fff5f5;border:1px solid #f2cccc;border-radius:12px;padding:12px;color:#b43b3b;font-size:12px;line-height:1.6}
</style>

<style id="study-wheel-fix">
.wheel{touch-action:none;overflow:hidden;position:relative}
.wheel-list{will-change:transform;user-select:none;-webkit-user-select:none}
.wheel-item{height:42px;display:flex;align-items:center;justify-content:center}
</style>


<style id="study-calendar-color-fix">
.calendar-card .day.sunday,.calendar-card .day.holiday{color:#d33!important}
.calendar-card .day.saturday{color:#3478d4!important}
.calendar-card .day.other.sunday,.calendar-card .day.other.holiday{color:#e8a0a0!important}
.calendar-card .day.other.saturday{color:#9ab8e5!important}
</style>

<style id="study-cal-colors-v3">
.calendar-card .day.sunday,.calendar-card .day.sunday .day-number,.calendar-card .day.holiday{color:#d33!important}
.calendar-card .day.saturday,.calendar-card .day.saturday .day-number{color:#3478d4!important}
.calendar-card .day.selected{color:#fff!important}
</style>
<style id="study-chart-v25">
.wheel-list{transition:transform .08s ease-out;touch-action:none}
.wheel-item.selected{font-weight:900!important;color:#111!important}
</style>

<style id="study-wheel-v7">
.wheel{height:168px;overflow:hidden;position:relative;touch-action:none}
.wheel::before{content:"";position:absolute;left:0;right:0;top:63px;height:42px;border-top:1px solid rgba(70,180,100,.35);border-bottom:1px solid rgba(70,180,100,.35);background:rgba(70,180,100,.08);pointer-events:none;z-index:2}
.wheel-list{position:absolute;left:0;right:0;top:0;will-change:transform;user-select:none;-webkit-user-select:none}
.wheel-item{height:42px;line-height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#888;box-sizing:border-box}
.wheel-item.selected{font-weight:800;color:#111}
</style>


<style id="study-metrics-v12">
.summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.summary>div{text-align:center;min-width:0}
.summary b{display:block;font-size:clamp(20px,2.5vw,30px);font-weight:800}
.summary span{display:block;margin-top:5px;color:#777;font-size:14px}
@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}}
</style>

<style id="study-forecast-v1">
.forecast-box{margin:12px 0 8px;padding:13px 14px;border:1px solid #e1e5e2;border-radius:14px;background:#fafcfb;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.forecast-box b{display:block;color:#7b827d;font-size:11px;font-weight:700;margin-bottom:4px}
.forecast-box strong{display:block;font-size:17px;font-weight:800;color:#2d9147}
.forecast-box small{grid-column:1/-1;color:#7b827d;font-size:10px;margin-top:1px}
@media(max-width:520px){.forecast-box{grid-template-columns:1fr}.forecast-box small{grid-column:auto}}
</style>

<style id="study-recordable-v14">
.day:not(.recordable){cursor:default}
.day.in-range:not(.recordable){opacity:.55}
</style>

</head>
<body>
<div id="app" class="app"></div>
<nav id="bottomNav">

  <a href="./calendar.html">カレンダー</a>

</nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>

</body>
</html>
